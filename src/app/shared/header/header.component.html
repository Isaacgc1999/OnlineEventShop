<header class="app-header">
    <div class="container app-header__bar">
        <a class="brand" routerLink="/" aria-label="Online Event Shop, all events">
            <span class="brand__mark">
                <span class="material-symbols-rounded" aria-hidden="true">confirmation_number</span>
            </span>
            <span class="brand__name">Online Event Shop</span>
        </a>
        <nav class="app-header__actions" aria-label="Main">
            <a class="app-header__link" href="https://github.com/Isaacgc1999/OnlineEventShop" target="_blank" rel="noopener">Contact</a>
            @if (totalTickets() > 0 && cartEventId()) {
                <a class="cart-link" [routerLink]="['/event', cartEventId()]"
                    [attr.aria-label]="'Cart, ' + totalTickets() + (totalTickets() === 1 ? ' ticket' : ' tickets')">
                    <span class="material-symbols-rounded" aria-hidden="true">shopping_bag</span>
                    <span class="cart-link__badge">{{ totalTickets() }}</span>
                </a>
            }
        </nav>
    </div>
</header>
