<a class="event-card" [routerLink]="['/event', event().id]">
    <div class="event-card__media">
        <img src="/images/sample-image.jpg" alt="" loading="lazy" />
        <span class="event-card__dates">{{ event().startDate | date:'d MMM' }} – {{ event().endDate | date:'d MMM' }}</span>
    </div>
    <div class="event-card__body">
        <span class="event-card__venue">
            <span class="material-symbols-rounded" aria-hidden="true">location_on</span>
            {{ event().place }}
        </span>
        <h2 class="event-card__title">{{ event().title | titlecase }}</h2>
        <p class="event-card__subtitle">{{ event().subtitle }}</p>
        <div class="event-card__footer">
            <span>View dates</span>
            <span class="event-card__go material-symbols-rounded" aria-hidden="true">chevron_right</span>
        </div>
    </div>
</a>
